name: Skill Tests

# Runs tests/test_check.py, the behaviour tests for the bundled checker
# (skills/typo3-site-conformance/checker/check.py and gen_rules.py), through
# the skill-repo-skill tests reusable. The reusable runs each matched file with
# the runner's python3 and fails the job when one exits non-zero. The suite
# needs PyYAML, the checker's only third-party dependency, and fails with an
# error annotation when that python3 cannot import it.
#
# require_tests: the reusable counts the files under skills/*/checker/ as
# shipped scripts and fails the job when they ship but no test file ran.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  tests:
    uses: netresearch/skill-repo-skill/.github/workflows/tests.yml@main
    permissions:
      contents: read
    with:
      python_glob: "tests/*.py"
      require_tests: true
